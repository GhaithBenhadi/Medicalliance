<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medico Pro — Plateforme équipements médicaux</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    window.onerror = function(msg, src, line) {
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;padding:20px;font-family:system-ui;z-index:99999';
      d.innerHTML = '<div style="max-width:380px;text-align:center"><p style="font-weight:700;color:#dc2626;font-size:14px;margin-bottom:8px">Erreur JS (iOS debug)</p><p style="font-size:11px;color:#555;word-break:break-all;line-height:1.6">' + msg + '</p><p style="font-size:10px;color:#999;margin-top:6px">' + (src||'') + ' : ' + (line||'') + '</p><button onclick="location.reload()" style="margin-top:16px;padding:8px 20px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:13px;cursor:pointer">Recharger</button></div>';
      document.body.appendChild(d);
    };
  </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
